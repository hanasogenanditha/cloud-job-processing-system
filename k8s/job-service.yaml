apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-service
  template:
    metadata:
      labels:
        app: job-service
    spec:
      containers:
        - name: job-service
          image: hpnanditha/job_service:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/postgres
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BOOTSTRAP
              value: kafka-0.kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: job-service
spec:
  type: NodePort
  selector:
    app: job-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30007